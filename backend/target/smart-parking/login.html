<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Smart Parking</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            background:
                linear-gradient(
                    rgba(18, 59, 99, 0.85),
                    rgba(8, 169, 209, 0.85)
                );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;

            background: white;

            padding: 40px 35px;

            border-radius: 15px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .logo {
            text-align: center;
            font-size: 42px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #123b63;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;

            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;

            padding: 14px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 16px;

            outline: none;
        }

        input:focus {
            border-color: #08a9d1;

            box-shadow:
                0 0 5px rgba(8, 169, 209, 0.3);
        }

        .login-button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 7px;

            background: #08a9d1;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }

        .login-button:hover {
            background: #087fa5;
        }

        #message {
            text-align: center;

            margin-top: 18px;

            font-weight: bold;
        }

        .register-link {
            text-align: center;

            margin-top: 22px;

            color: #555;
        }

        .register-link a {
            color: #087fa5;

            text-decoration: none;

            font-weight: bold;
        }

        .home-link {
            text-align: center;

            margin-top: 16px;
        }

        .home-link a {
            color: #123b63;

            text-decoration: none;
        }

        @media (max-width: 500px) {

            body {
                padding: 15px;
            }

            .login-container {
                padding: 30px 20px;
            }

        }

    </style>

</head>


<body>

    <div class="login-container">

        <div class="logo">
            🚗
        </div>

        <h1>
            Welcome Back
        </h1>

        <p class="subtitle">
            Login to Smart Parking
        </p>


        <form onsubmit="loginUser(event)">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button">

                Login

            </button>

        </form>


        <div id="message"></div>


        <div class="register-link">

            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </div>


        <div class="home-link">

            <a href="index.html">
                ← Back to Home
            </a>

        </div>

    </div>


    <script>

        const API_URL =
            "http://localhost:8080/smart-parking";


        async function loginUser(event) {

            event.preventDefault();


            const email =
                document.getElementById("email")
                    .value
                    .trim();


            const password =
                document.getElementById("password")
                    .value;


            const message =
                document.getElementById("message");


            const formData =
                new URLSearchParams();


            formData.append(
                "email",
                email
            );


            formData.append(
                "password",
                password
            );


            try {

                const response =
                    await fetch(
                        API_URL + "/api/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/x-www-form-urlencoded"
                            },

                            body: formData
                        }
                    );


                const data =
                    await response.json();


                if (data.success) {

                    message.style.color =
                        "green";

                    message.innerHTML =
                        "Login successful!";


                    /* Save user information */

                    localStorage.setItem(
                        "userId",
                        data.id
                    );


                    localStorage.setItem(
                        "fullName",
                        data.fullName
                    );


                    localStorage.setItem(
                        "email",
                        data.email
                    );


                    localStorage.setItem(
                        "phone",
                        data.phone || ""
                    );


                    /* Go to dashboard */

                    setTimeout(function() {

                        window.location.href =
                            "dashboard.html";

                    }, 1000);

                }

                else {

                    message.style.color =
                        "red";

                    message.innerHTML =
                        data.message ||
                        "Invalid email or password.";

                }

            }

            catch (error) {

                console.error(error);

                message.style.color =
                    "red";

                message.innerHTML =
                    "Cannot connect to Java backend.";

            }

        }

    </script>

</body>

</html>
