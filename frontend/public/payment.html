<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment - Smart Parking</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #123b63,
                    #08a9d1
                );

            padding: 30px;
        }

        nav {
            background: #123b63;
            color: white;

            padding: 18px 6%;

            display: flex;
            justify-content: space-between;
            align-items: center;

            max-width: 1100px;
            margin: auto;

            border-radius: 10px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        .payment-container {
            width: 100%;
            max-width: 500px;

            background: white;

            margin: 40px auto;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.25);
        }

        .payment-icon {
            text-align: center;
            font-size: 45px;
        }

        h1 {
            text-align: center;
            color: #123b63;
            margin: 10px 0 25px;
        }

        .summary {
            background: #f1f5f9;

            padding: 20px;

            border-radius: 10px;

            margin-bottom: 25px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;

            padding: 8px 0;

            border-bottom: 1px solid #ddd;
        }

        .summary-row:last-child {
            border-bottom: none;
        }

        .total {
            font-size: 22px;
            font-weight: bold;
            color: #123b63;
            margin-top: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        select {
            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 16px;
        }

        .pay-button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 7px;

            background: #16a34a;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        .pay-button:hover {
            background: #15803d;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #123b63;
            text-decoration: none;
        }

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            nav {
                flex-direction: column;
                gap: 15px;
            }

            nav ul {
                flex-wrap: wrap;
                justify-content: center;
            }

            .payment-container {
                padding: 25px 20px;
            }

        }

    </style>

</head>

<body>


<nav>

    <div class="logo">
        🚗 Smart Parking
    </div>

    <ul>

        <li>
            <a href="index.html">Home</a>
        </li>

        <li>
            <a href="parking.html">Parking</a>
        </li>

        <li>
            <a href="booking.html">Booking</a>
        </li>

        <li>
            <a href="payment.html">Payment</a>
        </li>

    </ul>

</nav>


<div class="payment-container">

    <div class="payment-icon">
        💳
    </div>

    <h1>
        Parking Payment
    </h1>


    <div class="summary">

        <div class="summary-row">

            <span>
                Parking Slot
            </span>

            <strong id="slot">
                ---
            </strong>

        </div>


        <div class="summary-row">

            <span>
                Vehicle Number
            </span>

            <strong id="vehicle">
                ---
            </strong>

        </div>


        <div class="summary-row">

            <span>
                Amount
            </span>

            <strong class="total">
                ₹<span id="amount">0</span>
            </strong>

        </div>

    </div>


    <div class="form-group">

        <label>
            Payment Method
        </label>

        <select id="paymentMethod">

            <option value="">
                Select Payment Method
            </option>

            <option value="UPI">
                UPI
            </option>

            <option value="Card">
                Debit / Credit Card
            </option>

            <option value="Cash">
                Cash
            </option>

        </select>

    </div>


    <button
        class="pay-button"
        onclick="completePayment()">

        Pay Now

    </button>


    <div id="message"></div>


    <a
        href="dashboard.html"
        class="back">

        ← Back to Dashboard

    </a>

</div>


<script>

const slot =
    localStorage.getItem("bookingSlot") ||
    localStorage.getItem("selectedSlot") ||
    "---";


const vehicle =
    localStorage.getItem("vehicleNumber") ||
    "---";


const amount =
    localStorage.getItem("bookingAmount") ||
    "0";


document.getElementById("slot")
    .textContent = slot;


document.getElementById("vehicle")
    .textContent = vehicle;


document.getElementById("amount")
    .textContent = amount;


function completePayment() {

    const method =
        document.getElementById("paymentMethod")
            .value;


    const message =
        document.getElementById("message");


    if (!method) {

        message.style.color =
            "red";

        message.innerHTML =
            "Please select a payment method.";

        return;
    }


    message.style.color =
        "green";

    message.innerHTML =
        "Payment successful!";


    localStorage.setItem(
        "paymentMethod",
        method
    );

    localStorage.setItem(
        "paymentStatus",
        "PAID"
    );


    setTimeout(function() {

        alert(
            "Payment successful!\n" +
            "Slot: " + slot + "\n" +
            "Amount: ₹" + amount
        );


        window.location.href =
            "dashboard.html";

    }, 800);

}

</script>


</body>
</html>
